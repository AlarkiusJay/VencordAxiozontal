<script type="module">
const PROPS = ['display','flex-direction','flex','width','height','position','top','bottom',
 'inset-inline-start','inset-inline-end','margin','padding','rotate','translate','transform',
 'align-items','justify-content','grid-area','grid-template-areas','grid-template-rows',
 'grid-template-columns','z-index','overflow','column-gap','border-radius','background-color',
 'box-shadow','border-top','border-bottom','pointer-events','scrollbar-width','mask-image'];

async function load(url){
  const s = new CSSStyleSheet();
  await s.replace(await (await fetch(url)).text());
  return s;
}
function snapshot(){
  const map = {};
  for (const el of document.querySelectorAll('#app-mount, #app-mount *')) {
    const cs = getComputedStyle(el);
    const key = el.id || (el.tagName + '.' + [...el.classList].join('.'));
    const rec = {};
    for (const p of PROPS) rec[p] = cs.getPropertyValue(p);
    // pseudo-elements the theme styles
    for (const pe of ['::before','::after']) {
      const pcs = getComputedStyle(el, pe);
      rec[pe] = ['content','display','width','height','top','bottom','inset-inline-start','inset-inline-end','margin','background-color']
        .map(p => p + '=' + pcs.getPropertyValue(p)).join('|');
    }
    map[key] = rec;
  }
  return map;
}
const oldS = await load('old.css'), newS = await load('new.css');
document.adoptedStyleSheets = [oldS];
const A = snapshot();
document.adoptedStyleSheets = [newS];
const B = snapshot();

const diffs = [];
for (const key of Object.keys(A)) {
  for (const p of Object.keys(A[key])) {
    const a = A[key][p], b = B[key][p];
    if (a !== b) diffs.push(`${key}  ${p}\n    old: ${a}\n    new: ${b}`);
  }
}
document.getElementById('out').textContent =
  `elements compared: ${Object.keys(A).length}\nproperties each: ${PROPS.length + 2}\n\n` +
  (diffs.length ? `DIFFERENCES (${diffs.length}):\n\n` + diffs.join('\n\n')
                : 'IDENTICAL — every element computes the same styles under both versions.');
</script>
